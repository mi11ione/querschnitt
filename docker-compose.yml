# Two profiles (docs/SERVICE.md, "Footprints"):
#   lite  nightly chapter + subtopic delta (`ch sub`) with its store in an EXISTING Postgres (OPD's ~20 GB VPS):
#         QS_PG_DSN=postgresql://… docker compose --profile lite up -d
#         The store's tables are all `qs_*` (sql/qs_topics.sql), so they sit beside OPD's own `topics` without touching it.
#         Each night ends with the topics file (CONTRACT §1 rows) at /app/out/topics.jsonl.gz in volume `topics_out`;
#         OPD's Apache Hop job (upstream/hop/README.md) loads that file into OPD's `topics`.
#   full  Postgres + API + app + nightly delta (`ch sub yn bi ev`, saved ad-hoc topics): docker compose --profile full up -d
# The model endpoint and key come from the environment (QS_BASE_URL, QS_MODEL, QS_API_KEY); nothing secret is in the image.
name: querschnitt

x-common: &common
  build: .
  image: querschnitt:latest
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

x-model-env: &model-env
  QS_BASE_URL: ${QS_BASE_URL:-https://api.publicai.co/v1}
  QS_MODEL: ${QS_MODEL:-swiss-ai/apertus-v1.5-8b}
  QS_API_KEY: ${QS_API_KEY:-}
  QS_MAX_RATE: ${QS_MAX_RATE:-1.0}
  QS_NIGHTLY_AT: ${QS_NIGHTLY_AT:-02:30}

services:
  db:
    image: postgres:16-alpine
    profiles: [full]
    restart: unless-stopped
    environment:
      POSTGRES_USER: querschnitt
      POSTGRES_PASSWORD: ${QS_PG_PASSWORD:-querschnitt}
      POSTGRES_DB: querschnitt
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querschnitt -d querschnitt"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *common
    profiles: [full]
    depends_on: {db: {condition: service_healthy}}
    environment:
      <<: *model-env
      QS_PG_DSN: postgresql://querschnitt:${QS_PG_PASSWORD:-querschnitt}@db:5432/querschnitt
      QS_WRITE_TOKEN: ${QS_WRITE_TOKEN:-}              # set it before the port is reachable from outside (docs/SERVICE.md)
      QS_ADHOC_DAILY_USD: ${QS_ADHOC_DAILY_USD:-2.0}
    ports: ["127.0.0.1:${QS_PORT:-8000}:8000"]
    volumes: [runs:/app/runs, adhoc:/app/src/querschnitt/schemes/adhoc]

  nightly:
    <<: *common
    profiles: [full]
    depends_on: {db: {condition: service_healthy}}
    command: ["python", "-m", "querschnitt", "nightly"]
    environment:
      <<: *model-env
      QS_PG_DSN: postgresql://querschnitt:${QS_PG_PASSWORD:-querschnitt}@db:5432/querschnitt
      QS_PROFILE: full
    volumes: [data:/app/data, runs:/app/runs, adhoc:/app/src/querschnitt/schemes/adhoc]
    healthcheck: {disable: true}

  nightly-lite:
    <<: *common
    profiles: [lite]
    # the DSN is checked here, not with ${VAR:?}: compose interpolates every service, so that would break `--profile full`
    command: ["sh", "-c", "test -n \"$$QS_PG_DSN\" || { echo 'set QS_PG_DSN to the existing Postgres (the store creates its qs_* tables there if missing; OPD tables are never touched)'; exit 2; }; exec python -m querschnitt nightly"]
    environment:
      <<: *model-env
      QS_PG_DSN: ${QS_PG_DSN:-}
      QS_PROFILE: lite
      QS_TOPICS_OUT: /app/out/topics.jsonl.gz          # the hand-off: upstream/hop/load_topics.hwf loads it into OPD's `topics`
    volumes: [data:/app/data, runs:/app/runs, topics_out:/app/out]
    healthcheck: {disable: true}

volumes:
  pg: {}
  data: {}
  runs: {}
  adhoc: {}
  topics_out: {}
