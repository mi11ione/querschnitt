[project]
name = "querschnitt"
version = "0.6.0"
description = "One topic field for every Swiss parliament: APS chapters, ad-hoc topics and evidence for OpenParlData affairs, decided by Apertus."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "duckdb>=1.1",
  "pyarrow>=17",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
querschnitt = "querschnitt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/querschnitt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
